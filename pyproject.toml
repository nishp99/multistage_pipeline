[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multistage-pipeline"
version = "0.1.0"
description = "Projected-model dynamics of compute-limited multistage training"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "jax[cpu]>=0.8,<0.9", "optax>=0.2.4,<0.3", "matplotlib>=3.8,<4", "cvxpy>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["multistage_pipeline*", "experiments*"]
